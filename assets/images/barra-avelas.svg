<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <radialGradient id="bgBarra" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF7F0"/>
      <stop offset="100%" stop-color="#EEDECF"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C2817"/>
      <stop offset="50%" stop-color="#34180A"/>
      <stop offset="100%" stop-color="#241005"/>
    </linearGradient>
    <radialGradient id="hazelnutGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E5BF8F"/>
      <stop offset="60%" stop-color="#C28B52"/>
      <stop offset="100%" stop-color="#8E5424"/>
    </radialGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgBarra)"/>
  
  <!-- Shadow under bar -->
  <ellipse cx="200" cy="225" rx="130" ry="25" fill="rgba(42,24,16,0.2)"/>

  <!-- Chocolate Bar tilted in 3D -->
  <g transform="translate(100, 75) rotate(-6)">
    <!-- Base block of chocolate -->
    <rect x="0" y="0" width="190" height="120" rx="8" fill="url(#barGrad)" stroke="#1F0E05" stroke-width="2"/>
    
    <!-- Inner segments / squares of chocolate -->
    <!-- Row 1 -->
    <rect x="15" y="15" width="45" height="40" rx="4" fill="#432212" stroke="#251208" stroke-width="2"/>
    <rect x="18" y="18" width="39" height="34" rx="2" fill="#542C17" opacity="0.6"/>
    <rect x="72" y="15" width="45" height="40" rx="4" fill="#432212" stroke="#251208" stroke-width="2"/>
    <rect x="75" y="18" width="39" height="34" rx="2" fill="#542C17" opacity="0.6"/>
    <rect x="129" y="15" width="45" height="40" rx="4" fill="#432212" stroke="#251208" stroke-width="2"/>
    <rect x="132" y="18" width="39" height="34" rx="2" fill="#542C17" opacity="0.6"/>

    <!-- Row 2 -->
    <rect x="15" y="65" width="45" height="40" rx="4" fill="#432212" stroke="#251208" stroke-width="2"/>
    <rect x="18" y="68" width="39" height="34" rx="2" fill="#542C17" opacity="0.6"/>
    <rect x="72" y="65" width="45" height="40" rx="4" fill="#432212" stroke="#251208" stroke-width="2"/>
    <rect x="75" y="68" width="39" height="34" rx="2" fill="#542C17" opacity="0.6"/>
    <rect x="129" y="65" width="45" height="40" rx="4" fill="#432212" stroke="#251208" stroke-width="2"/>
    <rect x="132" y="68" width="39" height="34" rx="2" fill="#542C17" opacity="0.6"/>

    <!-- Hazelnut pieces embedded & on top -->
    <circle cx="40" cy="35" r="9" fill="url(#hazelnutGrad)"/>
    <circle cx="95" cy="85" r="11" fill="url(#hazelnutGrad)"/>
    <circle cx="150" cy="40" r="10" fill="url(#hazelnutGrad)"/>
    <circle cx="140" cy="80" r="8" fill="url(#hazelnutGrad)"/>
    <ellipse cx="60" cy="55" rx="7" ry="5" fill="#C28B52"/>
  </g>

  <!-- Whole hazelnuts beside bar -->
  <g transform="translate(80, 210)">
    <circle cx="18" cy="18" r="14" fill="url(#hazelnutGrad)"/>
    <path d="M12,10 C18,7 24,11 25,18 C26,24 20,29 14,27 C8,25 7,16 12,10 Z" fill="#6A3A16" opacity="0.4"/>
  </g>
  <g transform="translate(270, 195)">
    <circle cx="14" cy="14" r="12" fill="url(#hazelnutGrad)"/>
  </g>
</svg>

